<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Fişi tarat, harcamanı otomatik ekle. Aylık gelir-gider takibi.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fişçi">
<title>Fişçi — Fiş Tara, Harcamanı Takip Et</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Fiş<span>çi</span></div>
    <div class="month" role="group" aria-label="Ay seçimi">
      <button id="prevM" aria-label="Önceki ay">‹</button>
      <b id="mLabel"></b>
      <button id="nextM" aria-label="Sonraki ay">›</button>
    </div>
  </header>

  <!-- ÖZET -->
  <section class="view" id="v-ozet">
    <div class="hero">
      <small>Bu ay kalan</small>
      <div class="big" id="kalan">₺0</div>
      <div class="row">
        <div class="pill"><small>Gelir</small><b class="in" id="gelir">₺0</b></div>
        <div class="pill"><small>Gider</small><b class="out" id="gider">₺0</b></div>
      </div>
      <div class="comp" id="comp"></div>
    </div>

    <div id="alerts"></div>

    <div class="card">
      <h3>Kategoriler <small id="catTotal"></small></h3>
      <div class="donut-wrap">
        <svg id="donut" viewBox="0 0 120 120" aria-hidden="true"></svg>
        <div class="donut-center"><small>Gider</small><b id="donutTotal">₺0</b></div>
      </div>
      <div id="cats"></div>
    </div>

    <div class="card">
      <h3>Son hareketler <button class="link" data-go="hareket">Tümü ›</button></h3>
      <div id="recent"></div>
    </div>
  </section>

  <!-- HAREKETLER -->
  <section class="view" id="v-hareket" hidden>
    <div class="search">
      <input id="q" type="search" placeholder="Ara: Migros, yemek…" autocomplete="off">
    </div>
    <div class="chips" id="filter"></div>
    <div class="card"><div id="txs"></div></div>
  </section>

  <!-- BÜTÇE -->
  <section class="view" id="v-butce" hidden>
    <div class="card">
      <h3>Aylık bütçe limitleri <small>Limiti aşınca uyarır</small></h3>
      <div id="budgets"></div>
    </div>
    <div class="card">
      <h3>Veriler</h3>
      <p class="muted">Tüm kayıtlar sadece bu cihazda, tarayıcında tutulur. Ara ara yedek al abi.</p>
      <div class="grid2">
        <button class="btn sec" id="expCSV">📊 Excel (CSV)</button>
        <button class="btn sec" id="expJSON">💾 Yedek al</button>
        <button class="btn sec" id="impJSON">📂 Yedekten yükle</button>
        <button class="btn sec danger" id="reset">🗑️ Hepsini sil</button>
      </div>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
    </div>
    <div class="card about">
      <b>Fişçi</b> · fiş okuma tamamen telefonunda yapılır, fotoğraflar hiçbir yere gönderilmez.
    </div>
  </section>
</div>

<nav class="tabbar">
  <div class="tabbar-in">
    <button class="tab on" data-go="ozet"><span>🏠</span>Özet</button>
    <button class="tab" data-go="hareket"><span>📋</span>Hareketler</button>
    <button class="scan-fab" id="scanBtn" aria-label="Fiş tara">📷</button>
    <button class="tab" data-go="butce"><span>🎯</span>Bütçe</button>
    <button class="tab" id="addBtn"><span>＋</span>Ekle</button>
  </div>
</nav>

<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="gallery" accept="image/*" hidden>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
